name: Ping IndexNow after deploy

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy
        run: sleep 120

      - name: Ping IndexNow
        run: |
          RESPONSE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -L \
            -X GET \
            -H "x-indexnow-secret: ${{ secrets.INDEXNOW_SECRET }}" \
            https://fileflip.org/api/indexnow)
          
          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.txt
          
          if [ "$RESPONSE" -ne 200 ]; then
            echo "❌ IndexNow ping failed with status $RESPONSE"
            exit 1
          else
            echo "✅ IndexNow ping successful"
          fi
