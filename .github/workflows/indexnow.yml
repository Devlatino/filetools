# After each push to main, wait for Vercel deploy then ping IndexNow with all site URLs.
# Add INDEXNOW_SECRET in: Repository → Settings → Secrets and variables → Actions
name: Ping IndexNow after deploy
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy
        run: sleep 60
      - name: Ping IndexNow
        run: |
          res=$(curl -s -w "\n%{http_code}" -X GET \
            -H "x-indexnow-secret: ${{ secrets.INDEXNOW_SECRET }}" \
            https://fileflip.org/api/indexnow)
          body=$(echo "$res" | head -n -1)
          code=$(echo "$res" | tail -n 1)
          echo "Response ($code): $body"
          if [ "$code" != "200" ]; then exit 1; fi
