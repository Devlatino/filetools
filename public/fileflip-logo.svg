<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" width="200" height="44">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f4ff"/>
      <stop offset="100%" style="stop-color:#c7d9ff"/>
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="0" y="2" width="40" height="40" rx="10" fill="url(#bgGrad)"/>

  <!-- Back file (rotated slightly) -->
  <g transform="rotate(-7, 20, 22)">
    <rect x="9" y="11" width="14" height="18" rx="2.5" fill="none" stroke="#4f8ef7" stroke-width="1.8" opacity="0.4"/>
    <polyline points="18,11 18,16 23,16" fill="none" stroke="#4f8ef7" stroke-width="1.8" opacity="0.4"/>
  </g>

  <!-- Front file -->
  <g transform="rotate(5, 22, 24)">
    <rect x="16" y="14" width="14" height="18" rx="2.5" fill="url(#blueGrad)"/>
    <polygon points="25,14 30,19 30,32 16,32 16,14" fill="url(#blueGrad)"/>
    <polygon points="25,14 25,19 30,19" fill="#1a1a2e" opacity="0.35"/>
    <line x1="19" y1="23" x2="27" y2="23" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
    <line x1="19" y1="27" x2="25" y2="27" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Flip arrow -->
  <path d="M 28 34 A 5 5 0 0 0 34 29" fill="none" stroke="#4f8ef7" stroke-width="1.8" stroke-linecap="round"/>
  <polyline points="33,33 34,29 30,28.5" fill="none" stroke="#4f8ef7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <!-- "File" in light weight -->
  <text
    x="50"
    y="29"
    font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="20"
    font-weight="300"
    letter-spacing="-0.3"
    fill="url(#textGrad)"
  >File</text>

  <!-- "Flip" in bold -->
  <text
    x="88"
    y="29"
    font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="20"
    font-weight="700"
    letter-spacing="-0.5"
    fill="url(#blueGrad)"
  >Flip</text>

  <!-- Dot accent -->
  <circle cx="126" cy="27" r="2.5" fill="#4f8ef7" opacity="0.8"/>
</svg>
